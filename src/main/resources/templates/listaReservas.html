<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Usuaris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/dashboardAdmin.css">
    <script src="/js/dashboardAdmin.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<header class="nav-container">
    <nav class="navbar">
        <div class="logo">
            <a class="logo">
                <img src="/Imagenes/logo_openroad.png" alt="Logo" class="logo-img" width="55px" height="55px">
            </a>
        </div>
        <h1>Dashboard</h1>
        <ul class="nav-links">
            <li><a href="/">Inici</a></li>
            <li><a href="/cataleg">Catàleg</a></li>
            <li><a href="#section3">Contacte</a></li>
        </ul>
    </nav>
</header>

<main class="container mt-4">
    <section>
        <h2>Llista de Reserves</h2>
<!--        <a class="btn-crear" th:href="@{/admin/creaUsuariAdmin}">Crear</a>-->
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Matricula Vehicle</th>
                <th>Dni Usuari</th>
                <th>Estat</th>
                <th>Data Recollida</th>
                <th>Data Entrega</th>
                <th>Preu Complert</th>
                <th>Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="reservas : ${reserva}">
                <td th:text="${reservas.vehiculo.matricula}">Matricula Vehicle</td>
                <td th:text="${reservas.usuari.dni}">Nom</td>
                <td th:text="${reservas.estatReserva}">Estat</td>
                <td th:text="${reservas.fechaRecogida}">Data Recollida</td>
                <td th:text="${reservas.fechaEntrega}">Data Entrega</td>
                <td th:text="${reservas.preuComplert}">Preu Complert</td>

                <td>
                    <form th:action="@{/admin/cancelarReserva/{idReserva}/{matricula}(idReserva=${reservas.idReserva}, matricula=${reservas.vehiculo.matricula})}"
                     method="post" style="display:inline">
                        <button type="submit" class="btn btn-danger">Cancelar</button>
                    </form>
                    <form th:action="@{/admin/activarReserva/{idReserva}(idReserva=${reservas.idReserva})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-success">Activar</button>
                    </form>

                </td>
            </tr>


            </tbody>
        </table>
    </section>
</main>
</body>
</html>
