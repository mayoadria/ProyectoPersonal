<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Usuaris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/dashboardAdmin.css">
    <script src="/js/dashboardAdmin.js" defer></script>
    <script src="/js/header.js" defer></script>
    <link rel="stylesheet" href="/css/header.css" />

</head>
<body>
<div th:replace="/header.html :: siteHeader"></div>

<main class="container mt-4">
    <section>
        <form th:action="@{/admin/listaUsu}" method="get">
        <h2>Llista de Clients</h2>
        <a class="btn-crear" th:href="@{/admin/creaUsuariAdmin}">Crear</a>

        <button class="filter-toggle">Mostrar Filtres</button>

        <div class="filter-content">
            <div class="filtre">
                <label for="Dni" class="filt-txt">DNI:</label>
                <input type="text" id="Dni" name="Dni" th:value="${param.Dni}" class="filt-input">
            </div>
            <div class="filtre">
                <label for="Nom" class="filt-txt">NOM:</label>
                <input type="text" id="Nom" name="Nom" th:value="${param.Nom}" class="filt-input">
            </div>
            <div class="filtre">
                <label for="Cognom" class="filt-txt">Cognom:</label>
                <input type="text" id="Cognom" name="Cognom" th:value="${param.Cognom}" class="filt-input">
            </div>
            <div class="filtre">
                <label for="Email" class="filt-txt">EMAIL:</label>
                <input type="text" id="Email" name="Email" th:value="${param.Email}" class="filt-input">
            </div>
            <div class="filtre">
                <label for="nomUsuari" class="filt-txt">NOM USUARI:</label>
                <input type="text" id="nomUsuari" name="nomUsuari" th:value="${param.nomUsuari}" class="filt-input">
            </div>
            <div class="filtre">
                <label for="telf" class="filt-txt">NUM CONTACTE:</label>
                <input type="text" id="telf" name="telf" th:value="${param.telf}" class="filt-input">
            </div>
            <div class="filtre">
                <label for="codiPostal" class="filt-txt">CODI POSTAL:</label>
                <input type="text" id="codiPostal" name="codiPostal" th:value="${param.codiPostal}" class="filt-input">
            </div>
            <div class="filtre">
                <label for="direccio" class="filt-txt">ADREÇA:</label>
                <input type="text" id="direccio" name="direccio" th:value="${param.direccio}" class="filt-input">
            </div>
            <div class="filtre">
                <label for="poblacio" class="filt-txt">POBLACIÓ:</label>
                <input type="text" id="poblacio" name="poblacio" th:value="${param.poblacio}" class="filt-input">
            </div>
            <div class="filtre">
                <label for="estat" class="filt-txt">Estat:</label>
                <select id="estat" name="estat" class="filt-input">
                    <option value="">Tots</option>
                    <option th:each="estat : ${estats}" th:value="${estat}" th:text="${estat}"
                            th:selected="${param.estat == estat}"></option>
                </select>
            </div>
            <div class="filtre">
                <label for="pais" class="filt-txt">Pais:</label>
                <select id="pais" name="pais" class="filt-input">
                    <option value="">Tots</option>
                    <option th:each="pais : ${pais}" th:value="${pais}" th:text="${pais}"
                            th:selected="${param.pais == pais}"></option>
                </select>
            </div>
            <div class="filtre">
                <label for="size" class="filt-txt">Resultats per pàgina:</label>
                <select id="size" name="size" class="filt-input">
                    <option th:value="5" th:selected="${param.size == 5}">5</option>
                    <option th:value="10" th:selected="${param.size == 2}">10</option>
                    <option th:value="25" th:selected="${param.size == 25}">25</option>
                    <option th:value="50" th:selected="${param.size == 50}">50</option>
                </select>
            </div>

            <button type="submit" class="btn-crear">Filtrar</button>
        </div>
        </form>
        <div th:if="${mensajeError}" class="alert alert-danger">
            <p th:text="${mensajeError}"></p>
        </div>
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>DNI</th>
                <th>Nom</th>
                <th>Cognoms</th>
                <th>Email</th>
                <th>Nom usuari</th>
                <th>Telefón Contacte</th>
                <th>Codi Postal</th>
                <th>Direcció</th>
                <th>Població</th>
                <th>Estat</th>
                <th>Pais</th>

                <th>Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client : ${usu}">
                <td th:text="${client.dni}">DNI</td>
                <td th:text="${client.nom}">Nom</td>
                <td th:text="${client.cognoms}">Nom</td>
                <td th:text="${client.email}">Email</td>
                <td th:text="${client.nomUsuari}">Nom usuari</td>
                <td th:text="${client.numContacte}">Nom usuari</td>
                <td th:text="${client.codiPostal}">Codi Postal</td>
                <td th:text="${client.direccio}">Direcció</td>
                <td th:text="${client.poblacio}">Poblacio</td>
                <td th:text="${client.estat}">Estat</td>
                <td th:text="${client.pais}">Pais</td>
                <td>
                    <form th:action="@{/admin/eliminar/{nomUsuari}(nomUsuari=${client.nomUsuari})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-danger">Esborrar</button>

                    </form>
                    <form th:action="@{/admin/activar/{nomUsuari}(nomUsuari=${client.nomUsuari})}" method="post" style="display:inline">
                        <button type="submit"
                                th:text="${client.estat.name()} == 'ACTIVO' ? 'Desactivar' : 'Activar'"
                                th:classappend="${client.estat.name()} == 'ACTIU' ? ' btn btn-warning' : ' btn btn-success'">
                        </button>
                    </form>
                    <form th:action="@{/admin/editarUsuari/{nomUsuari}(nomUsuari=${client.nomUsuari})}" style="display:inline">
                        <button type="submit" class="btn btn-edit">Editar</button>
                    </form>

                </td>
            </tr>
            </tbody>
        </table>
        <!-- Controles de paginación -->
        <nav th:if="${page.totalPages > 1}" aria-label="Navegació de pàgines" class="mt-4">
            <ul class="pagination justify-content-center">

                <!-- Botón 'Anterior' -->
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/listaUsu(page=${page.number - 1}, size=${param.size},
                    dni=${param.dni},
                    nom=${param.nom},
                    cognom=${param.cognom},
                    email=${param.email},
                    nomUsuari=${param.nomUsuari},
                    telf=${param.telf},
                    codiPostal=${param.codiPostal},
                    direccio=${param.direccio},
                    poblacio=${param.poblacio},
                    estat=${param.estat},
                    pais=${param.pais})}">
                        Anterior
                    </a>
                </li>

                <!-- Números de página -->
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/admin/listaUsu(page=${i}, size=${param.size},
                    dni=${param.dni},
                    nom=${param.nom},
                    cognom=${param.cognom},
                    email=${param.email},
                    nomUsuari=${param.nomUsuari},
                    telf=${param.telf},
                    codiPostal=${param.codiPostal},
                    direccio=${param.direccio},
                    poblacio=${param.poblacio},
                    estat=${param.estat},
                    pais=${param.pais})}",
                       th:text="${i + 1}">
                    </a>
                </li>

                <!-- Botón 'Següent' -->
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/listaUsu(page=${page.number + 1}, size=${param.size},
                    dni=${param.dni},
                    nom=${param.nom},
                    cognom=${param.cognom},
                    email=${param.email},
                    nomUsuari=${param.nomUsuari},
                    telf=${param.telf},
                    codiPostal=${param.codiPostal},
                    direccio=${param.direccio},
                    poblacio=${param.poblacio},
                    estat=${param.estat},
                    pais=${param.pais})}">
                        Següent
                    </a>
                </li>
            </ul>
        </nav>
    </section>
</main>
</body>
</html>
