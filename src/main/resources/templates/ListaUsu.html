<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/dashboardAdmin.css">
    <script src="/js/dashboardAdmin.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<header class="nav-container">
    <nav class="navbar">
        <div class="logo">
            <a class="logo">
                <img src="/Imagenes/logo_openroad.png" alt="Logo" class="logo-img" width="55px" height="55px">
            </a>
        </div>
        <h1>Dashboard</h1>
        <ul class="nav-links">
            <li><a href="/">Inici</a></li>
            <li><a href="/cataleg">Catàleg</a></li>
            <li><a href="#section3">Contacte</a></li>
        </ul>
    </nav>
</header>

<main class="container mt-4">
    <section>
        <h2>Llista de Clients</h2>
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>DNI</th>
                <th>Nom</th>
                <th>Nom usuari</th>
                <th>Codi Postal</th>
                <th>Direcció</th>
                <th>Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client : ${usu}">
                <td th:text="${client.dni}">DNI</td>
                <td th:text="${client.nom}">Nom</td>
                <td th:text="${client.nomUsuari}">Nom usuari</td>
                <td th:text="${client.codiPostal}">Codi Postal</td>
                <td th:text="${client.direccio}">Direcció</td>
                <td>
                    <form th:action="@{/admin/eliminar/{nomUsuari}(nomUsuari=${client.nomUsuari})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-danger">Esborrar</button>
                    </form>

                    <form th:action="@{/admin/activar/{nomUsuari}(nomUsuari=${client.nomUsuari})}" method="post" style="display:inline">
                        <button type="submit"
                                th:text="${client.estat.name()} == 'ACTIVO' ? 'Desactivar' : 'Activar'"
                                th:classappend="${client.estat.name()} == 'ACTIU' ? ' btn btn-warning' : ' btn btn-success'">
                        </button>
                    </form>

                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
